<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb256" />
      <stop offset="50%" stop-color="#c59a3f" />
      <stop offset="100%" stop-color="#865f27" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6750" />
      <stop offset="100%" stop-color="#083c2e" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Border with Decorative Beaded Rim -->
  <circle cx="100" cy="100" r="92" fill="#083c2e" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="#c59a3f" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />

  <!-- Subtle Islamic 8-pointed star in background -->
  <g transform="translate(100, 100) scale(0.65) translate(-100, -100)" opacity="0.2">
    <rect x="30" y="30" width="140" height="140" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <rect x="30" y="30" width="140" height="140" fill="none" stroke="url(#goldGrad)" stroke-width="3" transform="rotate(45 100 100)" />
  </g>

  <!-- Central Open Book / Rehal (Wisdom & Knowledge - Hikhma) -->
  <g id="open-quran" transform="translate(0, -6)">
    <!-- Book Stand / Rehal Base -->
    <path d="M 68 138 L 100 155 L 132 138 L 100 148 Z" fill="url(#goldGrad)" />
    
    <!-- Left Page -->
    <path d="M 100 126 C 85 120, 60 118, 50 124 C 48 100, 48 85, 50 78 C 62 72, 85 75, 100 84 Z" 
          fill="#fdfbf7" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Left Page Text Lines -->
    <path d="M 58 88 Q 75 84 92 90 M 58 97 Q 75 93 92 99 M 58 106 Q 75 102 92 108" 
          stroke="#0b523e" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Right Page -->
    <path d="M 100 126 C 115 120, 140 118, 150 124 C 152 100, 152 85, 150 78 C 138 72, 115 75, 100 84 Z" 
          fill="#fdfbf7" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Right Page Text Lines -->
    <path d="M 108 90 Q 125 84 142 88 M 108 99 Q 125 93 142 97 M 108 108 Q 125 102 142 106" 
          stroke="#0b523e" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Central Spine Shadow -->
    <line x1="100" y1="84" x2="100" y2="126" stroke="#c59a3f" stroke-width="2.5" />
    
    <!-- Guiding Radiance Star above Book -->
    <polygon points="100,52 103,60 111,63 103,66 100,74 97,66 89,63 97,60" fill="url(#goldGrad)" />
  </g>

  <!-- Arching Ribbon or Framing Accent -->
  <path d="M 55 160 Q 100 174 145 160" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
