<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4d3c" />
      <stop offset="50%" stop-color="#083c2e" />
      <stop offset="100%" stop-color="#04261c" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d282" />
      <stop offset="50%" stop-color="#c59a3f" />
      <stop offset="100%" stop-color="#8c6420" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Islamic Geometric Luxury Rounded Square Shield -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#emeraldBg)" stroke="url(#goldBorder)" stroke-width="16" />
  <rect x="46" y="46" width="420" height="420" rx="90" fill="none" stroke="url(#goldBorder)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Authentic Hikhma Islamic School Official Brandmark -->
  <g filter="url(#badgeShadow)">
    <image href="data:image/png;base64," x="38" y="162" width="436" height="188" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>